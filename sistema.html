<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Despesas - Divisão de Despesas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="btnConfiguracoes">⚙️ Configurações</button>

    <main id="sistema">

    <header>
    <h1>Divisão de Despesas da Casa</h1>

    <p>
        Bem-vindo, <strong id="nomeUsuario"></strong>!
    </p>

    <p>
        Calcule e divida as despesas entre os moradores.
    </p>

    </header>


        <!-- CADASTRO DE DESPESAS -->

        <section id="despesas">

            <h2>Nova despesa</h2>

            <form>

                <label for="data">Data:</label>
                <input type="date" id="data">


                <label for="pessoas">Quantidade de pessoas:</label>
                <input type="number" id="pessoas" min="1">


                <h3>Despesas</h3>


                <label for="aluguel">Aluguel:</label>
                <input type="number" id="aluguel" step="0.01" min="0">


                <label for="gas">Gás:</label>
                <input type="number" id="gas" step="0.01" min="0">


                <label for="energia">Energia:</label>
                <input type="number" id="energia" step="0.01" min="0">


                <label for="agua">Água:</label>
                <input type="number" id="agua" step="0.01" min="0">


                <button type="submit">
                    Calcular despesas
                </button>

                <a href="historico.html">
                <button type="button">Ver histórico</button>
                </a>

            </form>

        </section>


        <!-- RESULTADO -->

        <section id="resultado">

            <h2>Resultado</h2>

            <p>
                Total das despesas:
                <strong>R$ 0,00</strong>
            </p>

            <p>
                Valor por pessoa:
                <strong>R$ 0,00</strong>
            </p>

        </section>

        <!-- SAIR -->

        <section>
            <button id="logout">Sair</button>
        </section>

    </main>

    <!-- MENU DE CONFIGURAÇÕES -->
<div id="menuConfiguracoes" class="menu-configuracoes">

    <div class="configuracoes-caixa">

        <h2>⚙️ Configurações</h2>

<div class="configuracao-item">
    <h3>🌙 Tema</h3>
    <p>Escolha entre o tema claro e escuro.</p>

    <button id="btnTema">
        🌙 Tema escuro
    </button>
    </div>

    <div class="configuracao-item">
    <h3>👤 Conta</h3>

    <p>
        Usuário conectado:
        <strong id="usuarioConfiguracao"></strong>
    </p>

    <button id="btnSairConfiguracoes">
        🚪 Sair da conta
    </button>
</div>

    <div id="dados" class="dados-acoes">
  <button id="btnExportarDados">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Exportar dados
  </button>
  
  <button id="btnImportarDados">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Importar dados
  </button>

  <button id="btnBaixarPDF">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 8 9"/></svg>
    Baixar PDF
  </button>

  <div class="divisor"></div>

  <button id="btnExcluirHistorico" class="btn-perigo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    Excluir histórico
  </button>
</div>
<input type="file" id="arquivoImportacao" hidden accept=".json">

    <button id="btnFecharConfiguracoes">

        Fechar
    </button>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="script.js"></script>

    <!-- MODAL BONITO -->
<div id="modalAviso" class="modal-fundo" style="display:none">
  <div class="modal-caixa">
    <h3 id="modalTitulo">Aviso</h3>
    <p id="modalTexto">Mensagem aqui</p>
    <div class="modal-botoes">
      <button id="modalBtnCancelar" style="display:none">Cancelar</button>
      <button id="modalBtnOk">OK</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

</body>

</html>
