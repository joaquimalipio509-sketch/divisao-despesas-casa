<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Divisão de Despesas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="login">

        <h1>Divisão de Despesas</h1>

        <h2>Criar conta</h2>

        <form id="formCadastro">

            <label for="novoUsuario">Usuário:</label>
            <input type="text" id="novoUsuario" required>

            <label for="novaSenha">Senha:</label>
            <input type="password" id="novaSenha" required>

            <label for="confirmarSenha">Confirmar senha:</label>
            <input type="password" id="confirmarSenha" required>

            <button type="submit">Cadastrar</button>

        </form>

        <p>
            Já possui uma conta?
            <a href="index.html">Voltar para o login</a>
        </p>

    </section>

    <script src="script.js"></script>

</body>

</html>
